<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarBrowser 下载</title>
  <style>
    :root { color-scheme: light; --ink: #1e293b; --muted: #64748b; --line: #dbe4ee; --accent: #0f766e; --accent-soft: #e6fffb; --bg: #f4f8fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(circle at top right, #d9f3ef, transparent 34rem), var(--bg); font: 16px/1.7 "Microsoft YaHei", "Segoe UI", sans-serif; }
    .merge-screen { min-height: 100vh; display: grid; place-items: center; }
    .merge-box { text-align: center; }
    .loader { width: 58px; height: 58px; margin: 0 auto 22px; border: 5px solid #c7e9e4; border-top-color: var(--accent); border-radius: 50%; animation: spin .85s linear infinite; }
    .merge-title { margin: 0; color: var(--ink); font-size: 1.35rem; font-weight: 700; }
    .merge-status { margin: 8px 0 0; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 560px) { main { margin: 20px auto; } .hero, section { padding: 24px; } }
  </style>
</head>
<body>
  <div class="merge-screen" id="mergeScreen" aria-live="polite" aria-busy="true">
    <div class="merge-box">
      <div class="loader" aria-hidden="true"></div>
      <p class="merge-title">正在合并</p>
      <p class="merge-status" id="mergeStatus">正在准备安装包...</p>
    </div>
  </div>
  <script>
    const parts = [
      "part/StarBrowser_x64_Setup.exe.part01",
      "part/StarBrowser_x64_Setup.exe.part02",
      "part/StarBrowser_x64_Setup.exe.part03",
      "part/StarBrowser_x64_Setup.exe.part04",
      "part/StarBrowser_x64_Setup.exe.part05",
      "part/StarBrowser_x64_Setup.exe.part06",
      "part/StarBrowser_x64_Setup.exe.part07"
    ];
    const mergeScreen = document.getElementById("mergeScreen");
    const mergeStatus = document.getElementById("mergeStatus");

    function closePage() {
      window.close();
      setTimeout(() => {
        mergeStatus.textContent = "下载完成，请关闭此页面。";
      }, 300);
    }

    async function mergeAndDownload() {
      mergeScreen.classList.add("visible");
      const chunks = [];
      try {
        for (let index = 0; index < parts.length; index += 1) {
          mergeStatus.textContent = `正在下载第 ${index + 1}/${parts.length} 个分卷...`;
          const response = await fetch(parts[index]);
          if (!response.ok) {
            throw new Error(`分卷 ${index + 1} 下载失败（HTTP ${response.status}）`);
          }
          chunks.push(await response.arrayBuffer());
        }
        mergeStatus.textContent = "正在合并安装包...";
        const file = new Blob(chunks, { type: "application/vnd.microsoft.portable-executable" });
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = "StarBrowser_x64_Setup.exe";
        link.click();
        mergeStatus.textContent = "合并完成，正在下载...";
        setTimeout(() => {
          URL.revokeObjectURL(url);
          closePage();
        }, 800);
      } catch (error) {
        mergeStatus.textContent = `下载失败，请刷新页面重试。`;
      }
    }

    window.addEventListener("load", mergeAndDownload, { once: true });
  </script>
</body>
</html>
